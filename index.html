<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NordWash" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <title>NordWash - Fresh Laundry, Delivered to You</title>
    <meta name="description" content="NordWash connects you with local washers who pick up, clean, and deliver your laundry. Save time with professional laundry service." />
    <meta name="author" content="NordWash" />
    <meta name="keywords" content="laundry, laundry service, wash, dry clean, pickup, delivery, NordWash" />

    <meta property="og:title" content="NordWash - Fresh Laundry, Delivered to You" />
    <meta property="og:description" content="Connect with local washers who pick up, clean, and deliver your laundry. Save time with professional laundry service." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NordWash" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Security Headers -->
    <!-- Content Security Policy - Strict policy to prevent XSS -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://cdn.gpteng.co;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://lovable.dev https://cdn.gpteng.co;
      frame-ancestors 'self' https://lovable.dev https://*.lovable.app;
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      upgrade-insecure-requests;
    " />
    
    <!-- Clickjacking Protection -->
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    
    <!-- XSS Protection (legacy browsers) -->
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <!-- Prevent MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    
    <!-- Referrer Policy - Don't leak sensitive URLs -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Permissions Policy - Restrict browser features -->
    <meta http-equiv="Permissions-Policy" content="
      geolocation=(self),
      microphone=(),
      camera=(),
      payment=(self),
      usb=(),
      magnetometer=(),
      gyroscope=(),
      accelerometer=()
    " />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0ea5e9" />
  </head>
